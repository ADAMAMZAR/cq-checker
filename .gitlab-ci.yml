stages:
  - lint
  - test
  - deploy_backend
  - deploy_frontend

# ── Lint: check code style and import health ─────────────────────
lint_backend:
  stage: lint
  image: python:3.13-slim
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd backend
    - pip install --no-cache-dir flake8
  script:
    - flake8 app/ tests/ --max-line-length=120 --ignore=E501,W503,E402,W292,W291,W293,W391

# ── Test: FastAPI Python Backend (unit tests, no DB) ─────────────
test_backend:
  stage: test
  image: python:3.13-slim
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  before_script:
    - cd backend
    - export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -v tests/

# ── Test: Next.js Frontend Compilation ───────────────────────────
test_frontend:
  stage: test
  image: node:24-alpine
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  cache:
    paths:
      - frontend/node_modules/
      - frontend/.next/cache/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

# ── Deploy: Google Cloud Run (Backend) ───────────────────────────
deploy_backend:
  stage: deploy_backend
  image: google/cloud-sdk:slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

  before_script:
    # Authenticate GCP using service account key stored in GitLab CI/CD Variables
    - |
      if [ -f "$GCP_SA_KEY" ]; then
        cp "$GCP_SA_KEY" /tmp/gcp-sa-key.json
      else
        echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json
      fi
    - gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
    - gcloud config set project ${GCP_PROJECT_ID:-gen-lang-client-0447597759}
  script:
    - |
      ENV_VARS="^;;^ENVIRONMENT=production;;SESSION_COOKIE_NAME=__session"
      [ -n "$GCP_PROJECT_ID" ] && ENV_VARS="$ENV_VARS;;GCP_PROJECT_ID=$GCP_PROJECT_ID"
      [ -n "$FIRESTORE_DATABASE" ] && ENV_VARS="$ENV_VARS;;FIRESTORE_DATABASE=$FIRESTORE_DATABASE"
      [ -n "$ALLOWED_ORIGINS" ] && ENV_VARS="$ENV_VARS;;ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
      [ -n "$ENTRA_REDIRECT_URI" ] && ENV_VARS="$ENV_VARS;;ENTRA_REDIRECT_URI=$ENTRA_REDIRECT_URI"
      [ -n "$SESSION_SECRET" ] && ENV_VARS="$ENV_VARS;;SESSION_SECRET=$SESSION_SECRET"
      [ -n "$ENTRA_CLIENT_ID" ] && ENV_VARS="$ENV_VARS;;ENTRA_CLIENT_ID=$ENTRA_CLIENT_ID"
      [ -n "$ENTRA_TENANT_ID" ] && ENV_VARS="$ENV_VARS;;ENTRA_TENANT_ID=$ENTRA_TENANT_ID"
      [ -n "$ENTRA_CLIENT_SECRET" ] && ENV_VARS="$ENV_VARS;;ENTRA_CLIENT_SECRET=$ENTRA_CLIENT_SECRET"

      gcloud run deploy gpodeck-backend \
        --source backend \
        --region us-west1 \
        --allow-unauthenticated \
        --min-instances 0 \
        --max-instances 3 \
        --concurrency 80 \
        --cpu-throttling \
        --memory 512Mi \
        --timeout 60s \
        --update-env-vars "$ENV_VARS"

      gcloud run services update gpodeck-backend \
        --region us-west1 \
        --max-instances 3

      # Prune old Artifact Registry container images (keep latest 3 versions to eliminate storage costs)
      IMAGE_REPO="us-west1-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/gpodeck-backend"
      OLD_DIGESTS=$(gcloud artifacts docker images list "$IMAGE_REPO" --sort-by=~CREATE_TIME --format="value(DIGEST)" 2>/dev/null | tail -n +4) || true
      if [ -n "$OLD_DIGESTS" ]; then
        for digest in $OLD_DIGESTS; do
          echo "Pruning stale build artifact: ${digest}"
          gcloud artifacts docker images delete "${IMAGE_REPO}@${digest}" --delete-tags --quiet 2>/dev/null || true
        done
      fi
  after_script:
    - rm -f /tmp/gcp-sa-key.json

# ── Deploy: Firebase Hosting (Frontend) ──────────────────────────
deploy_frontend:
  stage: deploy_frontend
  image: node:24-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*
        - firebase.json
        - .firebaserc
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

  cache:
    paths:
      - frontend/node_modules/
      - frontend/.next/cache/
  before_script:
    - cd frontend
    - npm ci
  script:
    # 1. Build Next.js static export bundle (output: frontend/out)
    - npm run build:static
    - cd ..
    # 2. Deploy to Firebase Hosting via CI Token
    - npx --yes firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"